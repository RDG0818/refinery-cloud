name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'refinery-dashboard/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: refinery-dashboard
        run: npm ci

      - name: Build
        working-directory: refinery-dashboard
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: refinery-dashboard/dist

      - id: deployment
        uses: actions/deploy-pages@v4
